<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SDK Demo - Synthetic Errors</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      background: #1a1a2e;
      min-height: 100vh;
      color: #e4e4e7;
    }
    h1 { color: #a78bfa; margin-bottom: 0.25rem; }
    .subtitle { color: #71717a; margin-bottom: 2rem; }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    button {
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      color: white; border: none; padding: 0.75rem 1.5rem;
      border-radius: 8px; cursor: pointer; margin: 0 0.5rem 0.5rem 0;
    }
    button.danger { background: linear-gradient(135deg, #dc2626, #f87171); }
    .log {
      background: #0f0f23; border: 1px solid #27272a; border-radius: 8px;
      padding: 1rem; font-family: monospace; font-size: 0.85rem;
      max-height: 300px; overflow-y: auto; color: #a1a1aa;
    }
    .log-entry.success { color: #4ade80; }
    .log-entry.error { color: #f87171; }
    .log-entry.info { color: #60a5fa; }
  </style>
</head>
<body>
  <h1>SDK Demo</h1>
  <p class="subtitle">Synthetic errors for SDK testing only - use <code>examples/live-demo</code> for the thesis demo.</p>

  <div class="card">
    <button onclick="triggerReferenceError()" class="danger">ReferenceError</button>
    <button onclick="triggerTypeError()" class="danger">TypeError</button>
    <button onclick="triggerSyntaxError()" class="danger">SyntaxError</button>
    <button onclick="triggerUnhandledRejection()" class="danger">Unhandled Promise</button>
  </div>

  <div class="card">
    <div class="log" id="log"></div>
  </div>

  <script type="module">
    import { init, addBreadcrumb } from '../../client-sdk/src/index.js';

    const logEl = document.getElementById('log');
    function log(msg, type = 'info') {
      const el = document.createElement('div');
      el.className = `log-entry ${type}`;
      el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logEl.appendChild(el);
    }

    init({
      endpoint: 'http://localhost:3000',
      projectKey: 'sdk-demo',
      release: '1.0.0',
      environment: 'development',
      debug: true,
    });
    log('SDK initialized (projectKey: sdk-demo)', 'success');

    window.triggerReferenceError = () => { undefinedVariable.doSomething(); };
    window.triggerTypeError = () => { const o = null; o.method(); };
    window.triggerSyntaxError = () => { eval('function {'); };
    window.triggerUnhandledRejection = () => { Promise.reject(new Error('test')); };
  </script>
</body>
</html>
